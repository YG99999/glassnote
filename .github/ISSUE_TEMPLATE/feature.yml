name: Feature request
description: Describe a concrete problem Glassnote could solve.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: How would this fit the compact capture workflow?
